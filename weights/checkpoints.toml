# Where Laya's checkpoints stand. The weights themselves are runtime data and never stand in this repository;
# this is the one place their folders are declared, and the tooling reads it.

# Under the runtime data root on the operations machine: the collection every trained checkpoint is carried
# back to, a folder per gate, its run and its step under it (docs/training.md, 「Checkpoint naming and
# collection」).
collection = "workbench/worker/laya-checkpoints"

# Under the account's home on a service node: the store the engine's folder links its checkpoints to, which
# outlives any installation (docs/llm-server.md, 「The machines」).
node_store = ".local/share/bmo-laya/checkpoints"
