# ------------------------------------------------------------
# llm-tunnel.ahas.io
# ------------------------------------------------------------
#
# The nginx config NPM would generate for the house LLM service's tunnel door, authored here so the
# WebSocket upgrade and the wildcard certificate are stated outright. It is one half of the proxy
# host; the row in NPM's proxy_host table is the other, and the two agree (docs/llm-server.md,
# 「Installing and updating」). It is written to /data/nginx/proxy_host/<id>.conf inside NPM's LXC with
# HOSTID replaced by the row's id. The forward target is main-host's bridge on port 18022.

server {
  set $forward_scheme http;
  set $server         "192.0.2.8x";
  set $port           18022;

  listen 80;
listen [::]:80;

listen 443 ssl http2;
listen [::]:443 ssl http2;

  server_name llm-tunnel.ahas.io;

  # Let's Encrypt SSL
  include /etc/nginx/conf.d/include/letsencrypt-acme-challenge.conf;
  include /etc/nginx/conf.d/include/ssl-ciphers.conf;
  ssl_certificate /etc/letsencrypt/live/npm-76/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/npm-76/privkey.pem;

    # Force SSL
    include /etc/nginx/conf.d/include/force-ssl.conf;

  access_log /data/logs/proxy-host-HOSTID_access.log proxy;
  error_log /data/logs/proxy-host-HOSTID_error.log warn;

client_max_body_size 0;
proxy_buffering off;
proxy_request_buffering off;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;

  location / {
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_http_version 1.1;

    # Proxy!
    include /etc/nginx/conf.d/include/proxy.conf;
  }

  # Custom
  include /data/nginx/custom/server_proxy[.]conf;
}
