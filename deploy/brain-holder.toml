# This service's standing line in every agent's brain: when to reach for it. How its tools are called is
# their manuals', handed with a tool's first call in a session.
held_by = "gate"

[[memory]]
key = "gate.when"
type = "tip"
recall_condition = "translate a text, or knowledge the turn lacks"
text = "Translate with gate/translate and answer its readings as returned; look up missing knowledge with gate/reference_search before stating it."
