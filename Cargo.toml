# The workspace: the gate's own package at the root, and the crates it is built from under `crates/`, each named
# as a member as it stands. The root package also holds the checks that span the repository and every test of
# the repository in `tests/`, the Python and Bun suites among them, which a Cargo test of their own runs.
[workspace]
members = ["crates/codes", "crates/markup", "crates/policy", "crates/ports", "crates/store", "crates/words"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
async-trait = "0.1.92"
# The stand-in units the ports' tests answer from.
axum = { version = "0.8.4", default-features = false, features = ["http1", "json", "query", "tokio"] }
futures-util = "0.3.34"
gate-codes = { path = "crates/codes" }
gate-markup = { path = "crates/markup" }
gate-policy = { path = "crates/policy" }
gate-ports = { path = "crates/ports" }
gate-store = { path = "crates/store" }
gate-words = { path = "crates/words" }
# Markdown read as CommonMark reads it, where the gate reads it as a general format.
pulldown-cmark = { version = "0.13.0", default-features = false }
regex = "1.11.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "stream"] }
sea-orm = { version = "1.1.17", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-postgres"] }
sea-orm-migration = { version = "1.1.17", default-features = false, features = ["runtime-tokio-rustls", "sqlx-postgres"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio"] }
sse-stream = "0.2.6"
tokio = { version = "1.47.0", features = ["macros", "rt", "rt-multi-thread", "net", "time", "signal", "io-util", "process"] }
toml = { version = "0.8.23", default-features = false, features = ["parse"] }
unicode-segmentation = "1.12.0"
url = "2.5.8"

[package]
name = "bmo-gate"
description = "The gate stage of a turn: sanitising, reference selection, the output gate, the translator, and Laya, the decision filter, with its runtime, its training and its weights' declarations kept apart."
version.workspace = true
edition.workspace = true
publish = false

[dependencies]

[dev-dependencies]
axum.workspace = true
futures-util.workspace = true
gate-codes.workspace = true
gate-markup.workspace = true
gate-policy.workspace = true
gate-ports.workspace = true
gate-store.workspace = true
gate-words.workspace = true
# The README's folder table is read as markdown.
pulldown-cmark.workspace = true
sea-orm.workspace = true
sea-orm-migration.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio = { workspace = true, features = ["test-util"] }
toml.workspace = true

# The store's tests, one binary over a scratch database of each test's own.
[[test]]
name = "store"
path = "tests/store/main.rs"

# The ports' tests, one binary over stand-in units on the loopback.
[[test]]
name = "ports"
path = "tests/ports/main.rs"

# The markup crate's tests, one binary, a module per module of the crate.
[[test]]
name = "markup"
path = "tests/markup/main.rs"
