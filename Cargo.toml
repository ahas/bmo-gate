# The workspace: the gate's own package at the root, and the crates it is built from under `crates/`, each named
# as a member as it stands. The root package also holds the checks that span the repository and every test of
# the repository in `tests/`, the Python and Bun suites among them, which a Cargo test of their own runs.
[workspace]
members = ["crates/client", "crates/codes", "crates/command", "crates/laya-relay", "crates/markup", "crates/policy", "crates/ports", "crates/reference", "crates/runs", "crates/server", "crates/stages", "crates/store", "crates/words", "tools/translate"]
resolver = "3"

[workspace.package]
version = "0.9.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
async-trait = "0.1.92"
bmo-gate-client = { path = "crates/client" }
# The stand-in units the ports' tests answer from.
axum = { version = "0.8.4", default-features = false, features = ["http1", "json", "query", "tokio"] }
chrono = { version = "0.4.41", default-features = false, features = ["std"] }
# The unit command's words, read by the maintained reader of command lines.
clap = { version = "4.5.40", features = ["derive", "env"] }
futures-util = "0.3.34"
gate-codes = { path = "crates/codes" }
schemars = "1.2.3"
gate-command = { path = "crates/command" }
gate-markup = { path = "crates/markup" }
gate-policy = { path = "crates/policy" }
gate-ports = { path = "crates/ports" }
gate-reference = { path = "crates/reference" }
gate-runs = { path = "crates/runs" }
gate-server = { path = "crates/server" }
gate-stages = { path = "crates/stages" }
gate-store = { path = "crates/store" }
gate-translate-tool = { path = "tools/translate" }
gate-words = { path = "crates/words" }
http-body-util = "0.1.3"
# The relay's own connections to the nodes, kept open between calls.
hyper = { version = "1.6.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.16", features = ["tokio"] }
indexmap = { version = "2.14.2", features = ["serde"] }
inventory = "0.3.20"
laya-relay = { path = "crates/laya-relay" }
# The relay's contract test stops the relay's whole process group.
libc = "0.2.177"
markdown = "1.0.0"
# Markdown read as CommonMark reads it, where the gate reads it as a general format.
pulldown-cmark = { version = "0.13.0", default-features = false }
regex = "1.11.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "stream"] }
sea-orm = { version = "1.1.17", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-postgres"] }
sea-orm-migration = { version = "1.1.17", default-features = false, features = ["runtime-tokio-rustls", "sqlx-postgres"] }
serde = { version = "1.0.219", features = ["derive"] }
# The old archive's floats are read back exactly, so the migration compares equal rather than one ULP apart.
serde_json = { version = "1.0.140", features = ["float_roundtrip"] }
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio"] }
sse-stream = "0.2.6"
tempfile = "3.20.0"
thiserror = "2.0.21"
tokio = { version = "1.47.0", features = ["macros", "rt", "rt-multi-thread", "net", "time", "signal", "io-util", "process"] }
toml = { version = "0.8.23", default-features = false, features = ["parse"] }
unicode-normalization = "0.1.25"
unicode-segmentation = "1.12.0"
url = "2.5.8"

[package]
name = "bmo-gate"
description = "The gate stage of a turn: sanitising, reference selection, the output gate, the translator, and Laya, the decision filter, with its runtime, its training and its weights' declarations kept apart."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
axum.workspace = true
clap.workspace = true
gate-command.workspace = true
gate-server.workspace = true
laya-relay.workspace = true
tokio.workspace = true

# The service binary, the server crate standing at the settings file its first argument names.
[[bin]]
name = "gate-server"
path = "src/bin/gate-server.rs"

# The unit command, the command crate on the words it is given.
[[bin]]
name = "bmo-gate"
path = "src/bin/bmo-gate.rs"

# The Laya service's relay on the operations machine, the relay crate on its listen.
[[bin]]
name = "laya-relay"
path = "src/bin/laya-relay.rs"

[dev-dependencies]
axum.workspace = true
bmo-gate-client.workspace = true
# The unit command's words, as the tests hand them to it.
clap.workspace = true
futures-util.workspace = true
gate-codes.workspace = true
gate-command.workspace = true
gate-markup.workspace = true
gate-policy.workspace = true
gate-ports.workspace = true
gate-reference.workspace = true
gate-runs.workspace = true
gate-server.workspace = true
gate-stages.workspace = true
gate-store.workspace = true
# The translator's tool, its call answered against a stand-in gate.
gate-translate-tool.workspace = true
gate-words.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
laya-relay.workspace = true
libc.workspace = true
# The README's folder table is read as markdown.
pulldown-cmark.workspace = true
# The personal-data check reads a tracked file for the shapes a value takes.
regex.workspace = true
# The callers the service's contract tests speak as.
reqwest.workspace = true
sea-orm.workspace = true
sea-orm-migration.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
toml.workspace = true
# A scratch database's address, another database's name in the test server's own.
url.workspace = true

# The contract's test: the committed OpenAPI document is the one the types generate.
[[test]]
name = "api"
path = "tests/api.rs"

# The store's tests, one binary over a scratch database of each test's own.
[[test]]
name = "store"
path = "tests/store/main.rs"

# The ports' tests, one binary over stand-in units on the loopback.
[[test]]
name = "ports"
path = "tests/ports/main.rs"

# The markup crate's tests, one binary, a module per module of the crate.
[[test]]
name = "markup"
path = "tests/markup/main.rs"

# The runs' tests, one binary over a scratch database and stand-in agency and gateway of each test's own.
[[test]]
name = "runs"
path = "tests/runs/main.rs"

# The gates' tests, one binary over a scratch database, a stand-in agency and gateway, and a stand-in Laya relay.
[[test]]
name = "stages"
path = "tests/stages/main.rs"

# The reference road's tests, one binary over a scratch database and stand-in brain, receiver, bmo-job, agency and
# gateway.
[[test]]
name = "reference"
path = "tests/reference/main.rs"

# The service's contract tests, one binary driving every route with its callers' bodies over a scratch database and
# stand-in units.
[[test]]
name = "server"
path = "tests/server/main.rs"

# The unit command's tests, one binary over the nouns, the evaluation set, the bench, the agreement and the cases,
# on a scratch database and stand-in units.
[[test]]
name = "command"
path = "tests/command/main.rs"

# The tools' test: each tool's manifest read against its folder and the declaration, and the translator's tool's
# calls answered against a stand-in gate.
[[test]]
name = "tools"
path = "tests/tools/main.rs"

# The relay's contract test: the relay binary started over a scratch data root, its nodes stand-in fronts on the
# loopback.
[[test]]
name = "laya-relay"
path = "tests/laya_relay/main.rs"
