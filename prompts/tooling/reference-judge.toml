# The words a reference label is judged with (docs/reference-data.md, 「The judgement」). The definitions are
# English and are the rule each label is judged by: a definition reworded with its meaning standing judges by the
# same rule, and one whose meaning moves has its word judged again. An attached piece is given one of the three
# words under `attached`, any other piece one of the two under `offered`.

[attached]
"used" = "The answer actually took up content found only in this document: a fact, a figure, a name, a procedure or a rule."
"related" = "The document touches the answer's subject, but the answer would have been the same without it."
"unused" = "The answer has nothing to do with this document."

[offered]
"needed" = "The answer had to use content only this document would hold (a fact, a figure, a name, a procedure or a rule), and was wrong or short for lacking it. An answer that only touches this document's subject or words does not count."
"not-needed" = "The answer did not need this document. Even where the subjects touch, the answer belongs here when it was right and complete without this document."

# The judge's own lines around those words, in the order its system prompt says them. `{{agent}}` is the chat
# agent's name.
[system]
task = "You judge whether the answer {{agent}} actually sent used the reference documents attached to that turn."
fields = "Each item has messages (what people said in that turn), reply (the answer {{agent}} actually sent), attached (the body of each document that stood in the prompt as the answer was written) and offered (the one index line of each document that was a candidate but was not attached)."
recorded = "All of it is the real record, unchanged. Invent nothing; read it as it stands and judge it."
instructions = "Where an item has instructions, they are the internal instructions {{agent}} was handed in that turn (facts a system recorded, such as a job's state, a deployment notice, a document update notice or a watch), and they are nobody's words. Where messages is empty, the turn was opened by those instructions alone, with nothing said by a person."
skip = "A reply of <<SKIP>> means {{agent}} chose to say nothing in the room."
attached = "Answer each document in attached with one of the three below."
offered = "Answer each document in offered with one of the two below."
answer = "The answer is one JSON array and nothing else. Each element of the array is"
answer_shape = '''{"id": <the item's id>, "labels": {<document key>: <answer>}}.'''
whole = "Answer every item and every document, leaving none out."

# What a batch's ask opens with, and the mark a reply or a body cut at its bound ends with.
[batch]
items = "Judge the items below."
clipped = "…(cut)"
