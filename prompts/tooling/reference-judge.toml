# The words a reference label is judged with (docs/reference-data.md, 「The judgement」), in the room language,
# word for word as the labels were judged by: a definition worded otherwise is a label judged by another
# rule. An attached piece is given one of the three words under `attached`, any other piece one of the two
# under `offered`.

[attached]
"used" = "답이 이 문서에만 있는 내용(사실, 수치, 이름, 절차, 규칙)을 실제로 가져다 썼다."
"related" = "답의 주제와는 맞닿아 있지만, 이 문서가 없었어도 답이 그대로였다."
"unused" = "답이 이 문서와 상관이 없다."

[offered]
"needed" = "답이 이 문서에만 있을 내용(사실, 수치, 이름, 절차, 규칙)을 써야 했는데, 그게 없어서 틀리거나 모자랐다. 답이 이 문서의 주제나 낱말을 건드린 것만으로는 여기에 들지 않는다."
"not-needed" = "답에 이 문서가 필요하지 않았다. 주제가 맞닿아 있어도 이 문서 없이 답이 맞고 모자람이 없었다면 여기에 든다."

# The judge's own lines around those words, in the order its system prompt says them. `{{agent}}` is the chat
# agent's name.
[system]
task = "너는 {{agent}}가 실제로 보낸 답이 그 턴에 붙은 참고 문서를 썼는지 판정한다."
fields = "항목마다 messages(그 턴에 사람들이 한 말), reply({{agent}}가 실제로 보낸 답), attached(답을 쓸 때 프롬프트에 붙어 있던 문서의 본문), offered(후보였지만 붙지 않은 문서의 목차 한 줄)가 있다."
recorded = "모두 실제 기록 그대로다. 지어내지 말고 있는 그대로 읽고 판정한다."
instructions = "instructions가 있으면 그 턴에 {{agent}}가 받은 내부 지시(작업 상태, 배포 알림, 문서 갱신 공지, 와치 같은 시스템이 기록한 사실)이고, 누구의 말도 아니다. messages가 비어 있으면 사람 말 없이 그 지시만으로 열린 턴이다."
skip = "reply가 <<SKIP>>이면 {{agent}}가 방에 아무 말도 하지 않기로 한 것이다."
attached = "attached의 문서마다 아래 셋 중 하나로 답한다."
offered = "offered의 문서마다 아래 둘 중 하나로 답한다."
answer = "답은 JSON 배열 하나뿐이고 다른 말은 쓰지 않는다. 배열의 각 원소는"
answer_shape = '{"id": <항목의 id>, "labels": {<문서 key>: <답>}} 이다.'
whole = "항목과 문서를 빠뜨리지 않고 모두 답한다."

# What a batch's ask opens with, and the mark a reply or a body cut at its bound ends with.
[batch]
items = "아래 항목들을 판정해라."
clipped = "…(잘림)"
