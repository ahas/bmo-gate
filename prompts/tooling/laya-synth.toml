# What the tooling tells a model when it has the model write a gate's rows (docs/gate-data.md, 「Invented data」),
# and each gate's specification as the rows carry it (docs/laya-gates.md). Every instruction and every question
# is English; Korean stands here only as conversation, in the worked rows' states, and as the room record's own
# attachment markers. A question is worded word for word as the gate asks it (`prompts/laya/questions.toml`): a
# question worded otherwise is one no checkpoint has learnt.
#
# `{{name}}` marks are filled by the code: `{{agent}}` with the chat agent's name and `{{owner}}` with the
# owner's, from the tooling's settings `agent_name` and `owner_name`; every other mark with the value its
# sentence names.

# The part of a writing prompt that never changes while one gate is written, line by line in the order it is
# said.
[prompt]
opening = "You write training data for a judging model. This batch belongs to one gate: {{title}} ({{gate}})."
judges = "What this gate decides: {{judges}}"
row = "A row is one JSON object with three fields: state, questions and gold."
row_state = "- state: the input the gate receives. Write it in exactly the shape below."
row_questions = "- questions: the questions the gate asks. Use their names, type and instructions exactly as given."
row_gold = "- gold: for every question, the right answer as a probability distribution. label is the answer with the highest probability; probabilities holds every answer the question can take and no other, and sums to 1."
untranslated = "Copy the questions' instructions exactly as written below, whatever language a batch's messages are in. A row whose question is reworded or translated is discarded."
spread = "  Put the weight on one side where the answer is certain, and split it as far as people would split where they would disagree. The more ambiguous a row, the closer to 0.5."
questions = "This gate's questions:"
noul_answers = "true or false"
per_candidate = "- One for each candidate. Its name is {{name}}, its type {{type}}."
candidate_slug = "the candidate's slug"
slug_and_id = "`<slug>:{{id}}`"
whole_question = "- Name `{{id}}`, type {{type}}."
instructions = "  The instructions begin with 「{{instructions}}」."
instructions_candidate = " After that comes what the candidate is."
answers = "  Answers: {{answers}}."
asymmetric = "  This question is asymmetric. The judging model may give only one answer on its own, {{safe}}, so write plenty of borderline cases where that answer and its opposite part."
candidates = "Each row offers {{min}} to {{max}} candidates."
slug_shape = "A candidate's slug uses only lower-case letters, digits and hyphens."
candidate_language = "A candidate's slug and the line saying what the candidate is come from the table of contents the brain holds in English, so write them in English, whatever language the messages are in."
transcript = "The shape of a conversation line. A row outside this shape is discarded:"
fields = "What each field of the state holds, exactly as the gate receives it:"
choices = "These fields of the state take only the fixed words below. A row that makes up another word is discarded:"
choice_or = " or "
rules = "Rules:"
invented_people = "- The people are invented. Names, ways of speaking, ages and forms of address differ from row to row, and no person is used twice."
no_copying = "- Copy nothing from real records. Write everything new."
one_call = "- A row fits one call of the judging model. The state stays under {{most}} characters, generously counted."
one_call_range = "- A row fits one call of the judging model. The state runs between {{least}} and {{most}} characters. That is the length of the input this gate really receives, so a shorter row gives itself away by its length."
example = "One example row:"
answer_only = "Answer with one JSON array and nothing else: no explanation and no preamble."

# How a transcript line is written, by the shape its gate receives.
[prompt.transcripts]
attachments = "- An attachment is a placeholder inside the text, written as the room's record writes it: `[사진]`, `[음성 1:23]`, `[파일 보고서.pdf]`, `[스티커 🐤]`, `[동영상 0:47]`."
plain_line = "<sender name> (id <sender number>): <text>"
plain_unknown = "- A sender whose number is not known is `unknown`."
plain_no_time = "- This shape carries no time and no reply marker. Do not add them."
room_line = "[<time>] #<message number> <sender name> (id <sender number>, OWNER): <text> <note>"
room_time = "- The time is an ISO 8601 instant in UTC. Spread the years, months and hours across the rows rather than bunching them in one month."
room_owner = "- `, OWNER` stands only on lines {{owner}} sent."
room_note = "- A note is one bracketed sentence after the text, and nothing stands there where there is none. A reply reads like `[replies to message 812, sent by 지우, shown elsewhere in this prompt]`."

# The part that changes every batch.
[prompt.batch]
count = "Write {{count}} rows."
language = "Language: {{help}}"
room = "Room: {{help}}"
lean = "Write this batch with inputs whose answer comes out {{lean}}."
edge = "This batch is borderline cases: inputs whose answer is not plain at a glance and on which people would disagree."
mixed_candidates = "Within one row, mix candidates whose answer is true with candidates whose answer is false."
seed = "Write nothing that overlaps an earlier batch. This batch's mark: {{seed}}"

# What each language a batch is written in means. The language is judged by the messages alone; the questions'
# instructions stay as written in every one.
[prompt.languages]
korean = "The messages are written in Korean. English mixes in only as a word, an identifier or a path."
english = "The messages are written in English only. A sender's name may be Korean."
mixed = "The messages mix Korean and English: a block of English longer than one line, such as a log, a code block or a list of paths, stands inside Korean text."

# What each kind of room a batch is set in is.
[prompt.rooms]
owner = "A private room with only {{owner}} and {{agent}} in it."
group = "A room with several people in it."
ai = "A room where another AI is present with the people. That AI speaks under its own name too."

# Each gate's specification as the rows carry it: its title, what it decides, the word its candidates are named
# by, each question's wording (and a choice question's options), and the worked row the prompt shows. A gold is
# written as its label and, for a yes/no, the chance of yes; for a choice, every option's chance.
[gates.knowledge-classifier]
title = "Note classifier"
judges = "whose way of working one note records"

[gates.knowledge-classifier.questions.scope]
instructions = "Whose way of working does this note record?"
options = { universal = "a universal rule {{agent}} follows in every room", personal = "the way of the one person who left the note", room = "an agreement that holds in this room alone", none = "not a way of working" }

[gates.knowledge-classifier.example]
state = { note = "혜린은 표를 받으면 먼저 합계 줄부터 본다. 합계가 맞아야 나머지를 읽는다.", author = "member" }

[gates.knowledge-classifier.example.questions]
scope = { type = "choice", instructions = "Whose way of working does this note record?", criteria = { universal = "a universal rule {{agent}} follows in every room", personal = "the way of the one person who left the note", room = "an agreement that holds in this room alone", none = "not a way of working" } }

[gates.knowledge-classifier.example.gold]
scope = { label = "personal", probabilities = { universal = 0.06, personal = 0.85, room = 0.05, none = 0.04 } }

[gates.output-format]
title = "Output format"
judges = "whether an outgoing message is sent to the chat room folded (wrapped in an expandable quote)"

[gates.output-format.questions.fold]
instructions = "Should this message be sent to the chat room folded (wrapped in an expandable quote)?"

[gates.output-format.example]
message = "**결론: 유닛은 다시 섰어요.**\n\n로그에 `Failed to find C compiler` 가 반복되고 있었고, 헤더가 빠져 있었습니다."

[gates.output-format.example.questions]
fold = "Should this message be sent to the chat room folded (wrapped in an expandable quote)?"

[gates.output-format.example.gold]
fold = { label = "false", noul = 0.21 }

[gates.reply-wanted]
title = "Reply-or-not judge"
judges = "whether this message that came into the room was said to {{agent}}"

[gates.reply-wanted.questions.forAgent]
instructions = "Was this message said to {{agent}}?"

[gates.reply-wanted.example]
state = { room = "group", recent = [
  "[2026-06-19T08:12:41.000Z] #5510 세영 (id 3391044): {{agent}}야 이번 주 당번 누구지",
  "[2026-06-19T08:12:58.000Z] #5511 {{agent}} (id 7000001): 이번 주는 준호 님이에요.",
], message = "[2026-06-19T08:13:20.000Z] #5512 세영 (id 3391044): 아 맞다 고마워" }

[gates.reply-wanted.example.questions]
forAgent = "Was this message said to {{agent}}?"

[gates.reply-wanted.example.gold]
forAgent = { label = "true", noul = 0.83 }
