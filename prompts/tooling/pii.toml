# The placeholder each kind of identifier is replaced by, so a line that held one still reads as a line that
# held one.
[placeholders]
secret_key = "[비밀키]"
token = "[토큰]"
secret_value = "[비밀값]"
mail = "[메일주소]"
phone = "[전화번호]"
