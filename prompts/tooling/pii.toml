# What a row built from a real turn carries in place of what only names an account (docs/gate-data.md,
# 「What leaves the rooms」), in the rooms' own language, as the rows hold it: a stand-in or a placeholder worded
# otherwise is a row the gates were not trained on.

# The stand-in display names, one pool per script. Ordinary names of their own language and nobody's in
# particular: a stand-in that reads as a placeholder teaches the model that a room is full of placeholders.
hangul_names = [
  "지훈", "나래", "세영", "준호", "도윤", "채원", "민서", "지안", "서준", "예린",
  "태오", "유진", "건우", "수아", "다인", "현우", "소율", "재민", "가온", "은서",
  "지우", "한별", "성민", "윤아", "정후", "다솜", "시우", "보라", "명준", "아름",
]

latin_names = [
  "Miller", "Fletcher", "Harlow", "Nadia", "Orson", "Petra", "Quill", "Rowan", "Sasha", "Tobias",
  "Ines", "Jonas", "Kira", "Lars", "Mira", "Noel", "Otto", "Pia", "Rhys", "Silke",
  "Tamsin", "Ulf", "Vera", "Wim", "Xenia", "Yara", "Zeno", "Alma", "Bruno", "Cleo",
