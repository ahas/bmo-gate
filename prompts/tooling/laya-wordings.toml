# The earlier wordings of each gate's Laya questions that rows already written may still ask, and the earlier
# words their candidates are named by (docs/gate-data.md, 「A question reworded」). Each asks the same question as
# the gate's own wording in `laya-synth.toml`, so the merge, the audit and the training's copy read a row asking
# one of them as asking the gate's own. These lists are what written rows hold; the `learnt` table at the end is
# the one part a model is asked.
#
# A wording that asks something other than the gate's question is never listed here: its gate is rebuilt
# (docs/gate-data.md, 「A gate whose question moved」). `{{agent}}` is filled as in `laya-synth.toml`.

[gates.knowledge-classifier.questions]
scope = ["이 메모가 기록하는 작업 방식은 누구의 것인가?"]

[gates.output-format.questions]
fold = ["이 메시지는 채팅방에 접어서(펼치기 인용으로 감싸서) 보내야 하는가?"]

[gates.reply-wanted.questions]
forAgent = ["이 메시지는 {{agent}}에게 한 말인가?"]

# The served checkpoints that learnt an earlier wording, each by its run's folder as the Laya server's health names
# its checkpoint, without the step, and the wording each of its questions is asked in, word for word as the
# checkpoint learnt it: one of the earlier wordings listed above for its gate (docs/laya.md, 「Each gate's probe」). A
# checkpoint named nowhere here is asked its gate's own wording in `prompts/laya/questions.toml`.
[learnt."checkpoints/output-format/real-2-fold"]
fold = "이 메시지는 채팅방에 접어서(펼치기 인용으로 감싸서) 보내야 하는가?"
