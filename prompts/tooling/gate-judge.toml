# What the judge of the real rows is told (docs/gate-data.md, 「Judging the real rows」). Its words are English; the
# rows it reads are in whatever language the rooms wrote them, and its answers are the question keys and answers
# the gate's own questions name.

# The system prompt, which says nothing about any one gate or any one row, line by line.
system = [
  "You give the verdicts of a judging gate in its place. For each item, read its state and answer every question in its questions with probabilities.",
  "The state is taken unchanged from a real conversation. Invent nothing; read it as it stands and judge it.",
  "The answer is one JSON array and nothing else. Each element of the array is",
  '''{"id": <the item's id>, "gold": {<question key>: {"probabilities": {<answer>: <probability>}}}}.''',
  "The keys of probabilities are exactly the answers the prompt names for that question, and they sum to 1.",
  "Where you are less certain about an item, split the probability, such as 0.7 against 0.3. Put an answer near 1.0 only where you are certain.",
  "Answer every item, in order, leaving none out.",
]

# One batch's ask: the gate's line, the answers each question may take, and then the items.
[batch]
gate = "The gate is {{gate}} ({{title}}), and it judges {{judges}}."
answers = "The answers each question may take:"
items = "Judge the items below."
