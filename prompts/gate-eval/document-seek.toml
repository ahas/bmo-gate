# The document seeker's member of the evaluation set (docs/gate-eval.md, 「What each gate is asked and how it is
# scored」): the topics its batches cycle through, what its brief says before and after the gate's real request,
# and the example that request is shown for.

topics = [
  "headings: one long operations document's heading paths, a question one heading answers",
  "headings: a rulebook's headings, a question in English about a Korean-titled section",
  "documents: candidates across rulebooks, persona and agent instructions under group labels",
  "documents: person books and knowledge pieces, a question about a person or a fact",
  "branches: the library's branches, a question whose answer lies in one branch",
  "a question no entry bears on (answer none)",
  "a question two or three entries answer, one more directly than the others",
]

head = "THE GATE: document-seek. In the console's document viewer a person asks where something is answered; the gate is handed an index and the question and names the entries to open."

body = '''
THE THREE KINDS OF INDEX (input.mode):
- headings: one document; one entry per heading, its line the heading path from the document title (A > B > C). group null.
- documents: candidate documents under their branch's label (group set to the branch name for each entry); a line is the name the document is called by and a few of its headings or topics, or for a reference piece its title and keywords.
- branches: one entry per searchable branch: its label, its one-line description and how many entries it holds (e.g. 'rulebooks — the room rulebooks the assistant answers by — 41 entries'). group null.
The documents are a chat assistant's working documents: rulebooks, persona, agent instructions, knowledge, person books (one per person, the owner's among them), lore and the operations manual, in Korean or English.

THE ITEM:
- input.entries: 6 to 60 entries, slugs short lowercase like h12 or d7 or b3 (letters, digits and hyphens only, unique). Make the index look real: plausible headings with near-miss neighbours.
- input.question: a question as a person types it, Korean or English, often in other words than the index uses.
- key.slugs: every slug a reader could rightly open FIRST to find the answer (usually one, at most three). Empty for a question no entry bears on (never empty for branches).
- easy: the question names the heading's own words. borderline: the answer is under a heading named in other words or another language, a broader heading competes with the exact one, or nothing answers it though entries look close.
'''

[example]
mode = "headings"
question = "배포 실패하면 어떻게 원래대로 돌려?"
entries = [
  { slug = "h1", line = "배포 > 배포가 하는 일" },
  { slug = "h2", line = "배포 > 되돌리기" },
  { slug = "h3", line = "배포 > 유닛 링크" },
]
