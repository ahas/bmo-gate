# The session summariser's member of the evaluation set (docs/gate-eval.md, 「What each gate is asked and how it
# is scored」): the topics its batches cycle through, what its brief says before the gate's real request and after
# its worker instructions, `{form_rule}` the rule every accepted form is written to, and the example the request is
# shown for.

topics = [
  "chat: a group room planning something together, several people with threads of their own",
  "chat: the owner and the assistant working through a technical problem in a private chat",
  "chat: a session spanning two rooms, one private and one group, whose facts must not cross",
  "chat: small talk that is finished, with nothing worth carrying (answer none)",
  "chat: a question left unanswered and a promise the assistant made",
  "worker: a job worker's own lines through an item: what it changed, checked, and what is left",
  "worker: a worker whose check failed and who settled on one approach over another, with the reason",
]

head = "THE GATE: session-summary. A chat session (a room with the assistant) or a job worker's session is about to be closed and replaced; the gate reads the tail and writes, in Korean, what the session was in the middle of. It has two instructions, chat and worker:"

body = '''
THE ITEM:
- input.kind: chat or worker.
- input.turns: the session's turns in order. A room turn (who room) holds the messages the room sent, one per line exactly as `[2026-09-04T17:27:27.000Z] 이름 (id 4169): 메시지`, with room the chat id (a negative number like -1001234567 for a group, a positive one for a private chat). An agent turn (who agent) holds the assistant's answer, its lines in Korean, with the same room. A worker session has agent turns only, room null, the worker writing about its job in Korean or English. 6 to 30 turns. Invent every name and id; no real person's data.
- key.none: true only where the tail holds nothing worth carrying.
- key.facts: what the note must carry, each as one to four short accepted forms that any faithful Korean note contains: a name, a number, a date, an identifier, a distinctive noun (written as the note would write it, in Korean where the note says it in Korean). Three to eight, empty where none is true. A room id is a fact only in a session that spans several rooms, where the instructions tie each fact to its room. {form_rule}
- key.avoid: strings the note must not carry: a fact of one room in a session where it would leak into another, a tool call or file path in a chat session, a person's character the note is told to leave out, a fact the transcript never states. Zero to four.
- easy: one room, one thread. borderline: several rooms, several people mid-sentence, a finished side topic to leave out, a thin tail.
'''

[example]
kind = "chat"
turns = [
  { who = "room", room = "-1001234567", lines = ["[2026-09-04T17:27:27.000Z] 민지 (id 4169): 내일 회의 몇 시였지?"] },
  { who = "agent", room = "-1001234567", lines = ["오후 3시야. 장소는 아직 안 정해졌어."] },
]
