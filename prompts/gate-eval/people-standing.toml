# The standing-sheet summariser's member of the evaluation set (docs/gate-eval.md, 「What each gate is asked and
# how it is scored」): the topics its batches cycle through, what its brief says before and after the gate's real
# request, `{form_rule}` the rule every accepted form is written to, the example that request is shown for, and the
# paths and ceiling the brain hands the summariser for each part's pieces (`{person}`, `{chat}` and `{slug}` filled
# in).

topics = [
  "common: a person with a clear way of speaking, values and working requests",
  "common: a person with little standing, whose sheet should be short",
  "room: a person's address, relations with others in the room, and promises under way",
  "room: a room with many past anecdotes that belong in the pieces, not the sheet",
  "pieces carrying private details (phone numbers, addresses, medical matters) the sheet must never carry",
  "views and judgements that must keep their kind, with dates the sheet must copy exactly",
]

head = "THE GATE: people-standing. The assistant keeps a book on every person it talks to, cut into pieces by topic; the gate reduces one part's pieces to the standing sheet that reaches the assistant on every turn the person speaks."

body = '''
THE ITEM:
- input.layer: common or room. input.chatId: a negative group id like -1001234567 (still given for common). input.userId: an invented positive id.
- input.pieces: two to eight pieces, each a slug and its markdown text. Slugs: for common c<userId>-<topic>, for room p<userId>-<topic>, topic lowercase letters, digits and hyphens (e.g. c4169-speech, p4169-promises). Each piece holds sections ## Facts, ## Views, ## Judgements whose items open with a bracket of dates as the instructions say ([date 2026-09-01 · confirmed 2026-09-05] for facts and views, [basis 2026-08-10 · confirmed 2026-09-05] for judgements). English, with Korean names, 호칭 and speech examples in Korean. Invent every person; no real person's data.
- key.facts: what the sheet must carry, each as one to three short accepted forms: a Korean 호칭 or speech ending exactly as written, a name, a distinctive word of a working request or promise, a date that must be copied. Three to eight. {form_rule}
- key.avoid: strings the sheet must not carry: a phone number, address or medical detail from the pieces, another room's name on a common sheet, an anecdote that belongs in the pieces, a date that appears in no piece. One to four, each present nowhere a correct sheet would put it.
- easy: few pieces, plain standing facts. borderline: many pieces with anecdotes to leave out, private details, views and judgements whose kind must not change, dates easy to miscopy.
'''

[example]
layer = "room"
chatId = -1001234567
userId = 4169
pieces = [
  { slug = "p4169-address", text = "## Facts\n- [date 2026-09-01 · confirmed 2026-09-05] Called 민지 in this room; the assistant answers her in 반말." },
]

[paths]
common = "people/{person}/chunks/{slug}.md"
room = "rooms/{chat}/people/chunks/{slug}.md"

[ceilings]
common = 8000
room = 6000
