# Each gate's profile (docs/gates.md): one for every gate of the gate order and for nothing else. A profile's
# values are defaults only: an owner's explicit choice is a row of the gate options table and survives a later
# change here. A profile names its role, the agency's role whose provider order its runs go out on, with the model,
# the effort, the thinking and the answer ceiling each entry names (docs/gates.md, 「Where a gate's runs go out」).
# It may also name:
# - switchable: the owner may switch it off, since its caller has a way of its own without it;
# - holds_no_session: its runs are asked about a session rather than held as one;
# - answer_tokens: the room its answer is given, where its answer is not the shape the common default was
#   measured against;
# - sampling: how its request with no tools samples, each setting by the name the engine reads it under: a
#   verdict at 0.1, a faithful rewrite at 0.3, a polished one at 0.5;
# - pool: the most of its runs out at once, where its callers keep more parts out at once than the pool's default
#   bound (gate-pool.toml).
#
# No gate stands in the order, so no profile stands here.

profile = []
