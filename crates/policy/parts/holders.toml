# What a holder leaves in an agent's brain (docs/reference-selection.md, 「What a turn is given」): the lines of the
# holders' sheet a turn carries. How much the sheet holds stands in reference.toml; the rows are the brain's.

# The holders' sheet: its head line, and one line a row a holder left (`{holder}` the holder's key, `{id}` the
# row's number, `{text}` its words).
[sheet]
head = "Standing instructions the services of this deployment left in your brain, by holder, none of them yours to change:"
line = "- [{holder} #{id}] {text}"

# The sheet of the rows a holder keyed to what the turn meets: its room, the kinds of the notices it carries. Its
# lines are the holders' sheet's.
[keyed]
head = "Standing instructions keyed to this room and to what this turn carries, by holder, none of them yours to change:"
