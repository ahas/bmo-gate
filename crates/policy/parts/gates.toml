# The gates and where each stands against a chat turn (docs/gates.md, 「The gate order」). Every gate stands here
# and the list of gates is read from it, so a gate cannot be added without a place; each has its profile in
# gate-profiles.toml. What each gate runs on is its route, which the agency resolves for its work key.
#
# A turn part is a list of steps in the order a turn passes them; a step holds the places of the gates the turn
# starts together and waits on together. A place names its gate, and the one condition its step runs under where
# it runs in some turns only.

# The off-turn part: the gates that run outside any chat turn, in the order the console lists them.
apart = ["translator"]

# The shelved part: the gates no turn and no caller asks (docs/gates.md, 「Shelved」). Their profiles, options and
# judgements stay readable. The three gates that picked a turn's reference, one library each, keep their marks
# (docs/reference-selection.md, 「The shelved pickers」): the evaluation and replay commands read the three from them.
shelved = [
  { key = "system-documents", reference = true },
  { key = "room-rules", reference = true },
  { key = "library-knowledge", reference = true },
  { key = "people-search" },
  { key = "room-memories" },
  { key = "situation-rules" },
  { key = "sanitizer" },
  { key = "document-seek" },
  { key = "voice-polish" },
  { key = "voice-reading" },
]

# The pre-gate part: the gates that run before the reply is written.

[[pre]]
places = [{ key = "session-summary", condition = "fresh-session" }]

# The post-gate part: the gates that run after the reply is written, before it reaches the room.

[[post]]
places = [{ key = "output-format", condition = "folding-dialect" }]
