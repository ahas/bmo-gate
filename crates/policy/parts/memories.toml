# What an agent holds in a room as a turn reads it (docs/reference-selection.md): the lines the memories entry is
# written in. How many due rows it carries stands in reference.toml.

# The memories entry: the head naming the rows that follow (`{count}` rows, `{items}` the word for them), each
# row's line and its parts, and the line on the rows not carried. How the entry is read and how an item is kept or
# a state moved stand in the room's block, not here.
[entry]
opening = "Your memories for this room — {count} open {items}, due now or bearing on this turn:"
item_one = "item"
item_many = "items"
line = "- #{id} {type} · written {written} KST{moved}{for}{from}: {action}"
moved = " · moved {at} KST"
for_user = " · for user {user}"
from_item = " · left open by item #{item}"
more = "- … {count} more open here, not carried this turn: brain_list with chat {chat}"
