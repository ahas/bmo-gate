# What a turn is handed with no pick (docs/reference-selection.md, 「What a turn is given」): the head of each
# speaker's sheet, the room's due memories and the rows the turn's events wake.

# What a turn may carry together, in characters.
turn_budget_chars = 30000

# What a person's sheet may hold where it attaches, in characters: the lines of the brain's rendering from the top,
# every name line and then the most important facts, as many as fit.
sheet_chars = 14000

# How many fact lines of a speaker's sheet attach on every turn as its head: the most important facts, as the
# brain's sheet orders them, with every name line carried ahead of them.
sheet_lines = 8

# What the org sheet may hold, in characters: its head line, then the lines of what stands for the person the agent
# serves, a locked one, the nearer unit's and the more important kept first (docs/reference-selection.md,
# 「What an organisation hands its members」).
organisation_chars = 2000

# What the holders' sheet may hold, in characters: its head line, then one line a row a holder left in the agent's
# brain, the holder's key first and the key the holder gave the row next ordering them; a row whose line does not
# fit is left out whole (docs/reference-selection.md, 「What a turn is given」).
holder_chars = 4000

# How many of a room's due memories, the errands whose event has come, attach on a turn, the latest first.
due = 3

# What the rows a turn's events wake may come to together, in characters.
woken_budget = 12000

# How long a standing row's line in the brain's index runs, in characters: the first line of its words, cut with …
index_chars = 120
