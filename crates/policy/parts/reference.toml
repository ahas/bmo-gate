# What a turn is handed with no pick (docs/reference-selection.md, 「What a turn is given」): the head of each
# speaker's sheet, the room's due memories and the rows the turn's events wake.

# What a turn may carry together, in characters.
turn_budget_chars = 30000

# What a person's sheet may hold where it attaches, in characters: the lines of the brain's rendering from the top,
# the most important first, as many as fit.
sheet_chars = 14000

# How many lines of a speaker's sheet attach on every turn as its head: the most important facts, as the brain's
# sheet orders them.
sheet_lines = 8

# How many of a room's due memories, the errands whose event has come, attach on a turn, the latest first.
due = 3

# What the rows a turn's events wake may come to together, in characters.
woken_budget = 12000

# How long a standing row's line in the brain's index runs, in characters: the first line of its words, cut with …
index_chars = 120
