# ------------------------------------------------------------
# The Laya service's tunnel door
# ------------------------------------------------------------
#
# The nginx config the proxy host for the tunnel's public name runs, authored here so the WebSocket upgrade
# and the certificate are stated outright (docs/llm-server.md, 「The tunnel」 and 「Installing and updating」).
# It is a template: before it is written under the proxy host, each name below is replaced with the
# deployment's own.
#
#   TUNNEL_NAME   the tunnel's public name
#   DOOR_ADDRESS  the operations machine's address on the proxy's network
#   DOOR_PORT     the door's port on the operations machine
#   CERTIFICATE   the folder of the zone's certificate under the proxy's certificate store
#   HOSTID        the proxy host's own id, which its log files are named by

server {
  set $forward_scheme http;
  set $server         "DOOR_ADDRESS";
  set $port           DOOR_PORT;

  listen 80;
  listen [::]:80;

  listen 443 ssl http2;
  listen [::]:443 ssl http2;

  server_name TUNNEL_NAME;

  include /etc/nginx/conf.d/include/letsencrypt-acme-challenge.conf;
  include /etc/nginx/conf.d/include/ssl-ciphers.conf;
  ssl_certificate /etc/letsencrypt/live/CERTIFICATE/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/CERTIFICATE/privkey.pem;

  include /etc/nginx/conf.d/include/force-ssl.conf;

  access_log /data/logs/proxy-host-HOSTID_access.log proxy;
  error_log /data/logs/proxy-host-HOSTID_error.log warn;

  client_max_body_size 0;
  proxy_buffering off;
  proxy_request_buffering off;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;

  location / {
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_http_version 1.1;

    include /etc/nginx/conf.d/include/proxy.conf;
  }

  include /data/nginx/custom/server_proxy[.]conf;
}
