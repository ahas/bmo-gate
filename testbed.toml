# How the testbed tests, checks, builds and deploys this repository, in the testbed's declaration format.

testbed = 0
name = "bmo-gate"

# The Cargo workspace, and the Bun projects of their own found by their manifests and lockfiles. The testbed has no
# Python language: the Python suites of the Laya runtime and training are run by Cargo tests of their own under
# `tests/`, so one `cargo test` gathers them with the rest.
[test]
languages = ["cargo", "bun"]
# The two Bun projects' packages, which their checks and the bundle's types stand on.
setup = ["cd training/tooling && bun install --frozen-lockfile", "cd package && bun install --frozen-lockfile", "cd client && bun install --frozen-lockfile"]

# The store's tests make their own scratch databases on the suite's server, so no template is named.
[test.database]

[check]
# The sweeps that read the tree before anything runs: letters that are not English in the code, the README's
# folder table and the dependencies the manifests name. The ledger records the lines each code file holds of
# the Korean the gate's test input, its patterns and its sample states are written in.
quick = ["korean", "layout", "dependencies"]
korean_ledger = "korean-ledger.json"
# The base libraries every unit may build on. The gate reaches every other unit through the routes and commands
# `docs/boundary-api.md` states.
base_libraries = ["bmo-chat", "bmo-chat-client", "bmo-ui", "bmo-gate-client"]

[[check.step]]
id = "check"
command = "cargo check --workspace --all-targets"
lane = "wide"

[[check.step]]
id = "clippy"
command = "cargo clippy --workspace --all-targets -- -D warnings"
lane = "wide"

[[check.step]]
id = "fmt"
command = "cargo fmt --all --check"

# Each tool under tools/ is checked by its own manifest (docs/api.md, 「The tool a tool host places」).
[tools]
dir = "tools"

[build]
# The service, the unit command, the Laya relay and the translator's tool, into the release's bin/.
binaries = ["gate-server", "bmo-gate", "laya-relay", "gate-translate-tool"]

# The gate's own deploy tree and the shared data root its settings, its runtime data and the tooling's settings
# stand under (docs/layout.md, 「The deployment」). The Python services stand on the nodes the Laya service's
# placement names, put there by its installer from the release, so no unit of theirs is installed here: the
# units are deploy/'s alone, never runtime/front/'s.
[deploy]
root = "~/.local/share/bmo-gate"
link = "deploy"
data_root = "~/.local/share/bmo/data"
env_links = [
  { link = "settings.toml", target = "env/gate.toml" },
  { link = "training/tooling/tooling.toml", target = "env/gate-tooling.toml" },
]
units = ["deploy/*.service", "deploy/*.timer"]
# Answers 0 once the service the deployed settings name answers ready (docs/boundary-api.md, 「Health」).
health = "cd ~/.local/share/bmo-gate/deploy && bin/bmo-gate health"

# The training tooling's packages, which a release's tooling units run on.
# The unit command, linked into the folder holding `bmo`, the first folder `bmo` looks for unit commands in. The
# link names this repository's deploy tree, whose own link stands across releases; a link made to the release
# being deployed would dangle once a later deployment prunes that release (docs/layout.md, 「The deployment」).
[[deploy.step]]
id = "link-unit-command"
phase = "before-flip"
command = '''
set -eu
bmo_dir="$(dirname "$(command -v bmo)")"
ln -sfn "$HOME/.local/share/bmo-gate/deploy/bin/bmo-gate" "$bmo_dir/bmo-gate"
'''

[[deploy.step]]
id = "tooling-packages"
phase = "before-flip"
command = "cd training/tooling && bun install --frozen-lockfile"

# The console bundle, built into the release's client/dist, the folder the deployed settings' [console] names
# (docs/layout.md, 「The console plugin bundle」).
[[deploy.step]]
id = "console-bundle"
phase = "before-flip"
command = "cd client && bun install --frozen-lockfile && bun run bundle"

# The translator's tool placed as one folder, its release executable beside its manifest, schemas and manual, and
# registered with the tool host as this repository's own, allowing the capability its entry asks for (docs/layout.md,
# 「The deployment」).
[[deploy.step]]
id = "register-translate"
phase = "before-flip"
command = '''
set -eu
rm -rf tools/translate/.placed
mkdir -p tools/translate/.placed
cp bin/gate-translate-tool tools/translate/tool.toml tools/translate/*.json tools/translate/manual.md tools/translate/.placed/
bmo pocket put tools/translate/.placed --placed --service bmo-gate --allow gate.translate
'''
