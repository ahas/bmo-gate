# How the testbed tests, checks, builds and deploys this repository, in the testbed's declaration format.

testbed = 0
name = "bmo-gate"

# The Cargo workspace, and the Bun projects of their own found by their manifests and lockfiles.
[test]
languages = ["cargo", "bun"]
# The two Bun projects' packages, which their checks stand on.
setup = ["cd training/tooling && bun install --frozen-lockfile", "cd package && bun install --frozen-lockfile"]

# The store's tests make their own scratch databases on the suite's server, so no template is named.
[test.database]

[check]
# The sweeps that read the tree before anything runs: letters that are not English in the code, the README's
# folder table and the dependencies the manifests name. The ledger records the lines each code file holds of
# the Korean the gate's test input, its patterns and its sample states are written in.
quick = ["korean", "layout", "dependencies", "cargo-profile", "shared-versions"]
korean_ledger = "korean-ledger.json"
# The base libraries every unit may build on. The gate reaches every other unit through the routes and commands
# `docs/boundary-api.md` states.
base_libraries = ["bmo-chat", "bmo-chat-client", "bmo-ui", "bmo-gate-client"]

# The repository whose root holds the shared versions the manifests and the lock hold to.
[check.shared_versions]
repository = "bmo-chat"

# No static step is declared for the Cargo workspace. The testbed's own Cargo workspace check formats and lints
# every member, every target compiled, through its Cargo verb in the shared build directory, wherever a change
# marks a crate, and the change check compiles every crate a change marks; a change that marks none has no Rust to
# judge.

# Each tool under tools/ is checked by its own manifest (docs/api.md, 「The tools a tool host places」).
[tools]
dir = "tools"

[build]
# The service, the unit command and the two tools, into the release's bin/.
binaries = ["gate-server", "bmo-gate", "gate-translate-tool", "gate-reference-tool"]

# The gate's own deploy tree and the shared data root its settings, its runtime data and the tooling's settings
# stand under (docs/layout.md, 「The deployment」). The units are deploy/'s alone.
[deploy]
root = "~/.local/share/bmo-gate"
link = "deploy"
data_root = "~/.local/share/bmo/data"
env_links = [
  { link = "settings.toml", target = "env/gate.toml" },
  { link = "training/tooling/tooling.toml", target = "env/gate-tooling.toml" },
]
units = ["deploy/*.service", "deploy/*.timer"]
# Answers 0 once the service the deployed settings name answers ready (docs/boundary-api.md, 「Health」).
health = "cd ~/.local/share/bmo-gate/deploy && bin/bmo-gate health"

# The unit command, stood in the folder holding `bmo`, the first folder `bmo` looks for unit commands in. It is a
# script rather than a link: the command reads `BMO_GATE_SETTINGS` where it is set and `settings.toml` in the folder
# it runs in otherwise, and a bare `bmo translate` runs from any folder, so the script names the settings this
# repository's deploy tree carries. It runs the deploy tree's own link, whose link stands across releases; one made
# to the release being deployed would dangle once a later deployment prunes that release (docs/layout.md, 「The
# deployment」).
[[deploy.step]]
id = "link-unit-command"
phase = "before-flip"
command = '''
set -eu
bmo_dir="$(dirname "$(command -v bmo)")"
settings="$HOME/.local/share/bmo-gate/deploy/settings.toml"
script="$bmo_dir/.bmo-gate-command"
cat > "$script" <<EOF
#!/bin/sh
# Written by bmo-gate's deployment: the command's settings stand in its deploy tree.
BMO_GATE_SETTINGS="\${BMO_GATE_SETTINGS:-$settings}"
export BMO_GATE_SETTINGS
exec "\$HOME/.local/share/bmo-gate/deploy/bin/bmo-gate" "\$@"
EOF
chmod 755 "$script"
mv "$script" "$bmo_dir/bmo-gate"
'''

# The tooling's packages, which a release's tooling commands run on.
[[deploy.step]]
id = "tooling-packages"
phase = "before-flip"
command = "cd training/tooling && bun install --frozen-lockfile"

# The translator's tool placed as one folder, its release executable beside its manifest, schemas and manual, and
# registered with the tool host as this repository's own, allowing the capability its entry asks for (docs/layout.md,
# 「The deployment」).
[[deploy.step]]
id = "register-translate"
phase = "before-flip"
command = '''
set -eu
rm -rf tools/translate/.placed
mkdir -p tools/translate/.placed
cp bin/gate-translate-tool tools/translate/tool.toml tools/translate/*.json tools/translate/manual.md tools/translate/.placed/
bmo pocket put tools/translate/.placed --placed --service bmo-gate --allow gate.translate
'''

# The brain's index tool placed as the translator's is, allowing the capability its three entries ask for.
[[deploy.step]]
id = "register-reference"
phase = "before-flip"
command = '''
set -eu
rm -rf tools/reference/.placed
mkdir -p tools/reference/.placed
cp bin/gate-reference-tool tools/reference/tool.toml tools/reference/*.json tools/reference/manual.md tools/reference/.placed/
bmo pocket put tools/reference/.placed --placed --service bmo-gate --allow gate.reference
'''
