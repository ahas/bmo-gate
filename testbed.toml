# How the testbed tests, checks, builds and deploys this repository, in the testbed's declaration format.

testbed = 0
name = "bmo-gate"

# The Cargo workspace, and the Bun projects of their own found by their manifests and lockfiles. The testbed has no
# Python language: the Python suites of the Laya runtime and training are run by Cargo tests of their own under
# `tests/`, so one `cargo test` gathers them with the rest.
[test]
languages = ["cargo", "bun"]

# The store's tests make their own scratch databases on the suite's server, so no template is named.
[test.database]

[check]
# The sweeps that read the tree before anything runs: Korean in the code, the README's folder table and the
# dependencies the manifests name. The ledger is the Korean allowed per code file; it allows none.
quick = ["korean", "layout", "dependencies"]
korean_ledger = "korean-ledger.json"
# The base libraries every unit may build on. The gate reaches every other unit through the routes and commands
# `docs/boundary-api.md` states.
base_libraries = ["bmo-chat", "bmo-chat-client", "bmo-ui"]

[[check.step]]
id = "check"
command = "cargo check --workspace --all-targets"
lane = "wide"

[[check.step]]
id = "clippy"
command = "cargo clippy --workspace --all-targets -- -D warnings"
lane = "wide"

[[check.step]]
id = "fmt"
command = "cargo fmt --all --check"
